[package]
name = "presenterm"
authors = ["Matias Fontanini"]
description = "A terminal slideshow presentation tool"
repository = "https://github.com/mfontanini/presenterm"
license = "BSD-2-Clause"
version = "0.16.1"
edition = "2021"

[dependencies]
anyhow = "1"
base64 = "0.23"
bincode = "1.3"
clap = { version = "4.6", features = ["derive", "string", "env"] }
comrak = { version = "0.59.0", default-features = false }
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
directories = "6.0"
hex = "0.4"
fastrand = "2.5"
flate2 = "1.1"
image = { version = "0.25", features = ["gif", "jpeg", "png"], default-features = false }
icy_sixel = "0.7"
merge-struct = "0.1.0"
itertools = "0.15"
once_cell = "1.21"
portable-pty = "0.9"
schemars = { version = "1.2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
syntect = { version = "5.3", features = ["parsing", "default-themes", "regex-onig", "plist-load"], default-features = false }
socket2 = "0.6"
strum = { version = "0.28", features = ["derive"] }
tempfile = { version = "3.27", default-features =  false }
tl = "0.7"
thiserror = "2"
unicode-width = "0.2"
os_pipe = "1.2"
libc = "0.2"
vte = "0.15"
termbg = "0.6.2"
vt100 = "0.18"
merman = { version = "0.7.0", features = ["raster"] }

[dev-dependencies]
rstest = { version = "0.28", default-features = false }

[features]
default = []
json-schema = ["dep:schemars"]

[profile.dev]
opt-level = 0
debug = true
panic = "abort"

[profile.test]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
panic = "unwind"
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
debug = false
